[package]
name = "readflow"
version = "0.1.0"
description = "A local-first AI RSS reader"
authors = ["greatshieh"]
license = "MIT"
rust-version = "1.70"
edition = "2021"

[profile.release]
codegen-units = 1 # 允许 LLVM 执行更好的优化。
lto = true # 启用链接时优化。
opt-level = "s" # 优先考虑小的二进制文件大小。如果您更喜欢速度，请使用 `3`。
panic = "abort" # 通过禁用 panic 处理程序来提高性能。
strip = true # 确保移除调试符号。

[lib]
name = "readflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
# tauri-build 的版本号与 tauri 框架并不同步（tauri 已到 2.12.x，tauri-build 最新仅 2.7.x），
# 故这里按 tauri-build 自己的节奏锁定为 2.7.2 —— 即Cargo.lock 中已验证可编译的版本。
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
# tray-icon：系统托盘图标（src/tray.rs）
# image-png：让 tauri::image::Image 具备 PNG 解码能力，托盘图标用 from_bytes 读取
# 版本必须与 npm 侧 @tauri-apps/api / @tauri-apps/cli 保持同major.minor（Tauri 构建脚本会强制校验），
# 因此这里收紧到 2.12.0，不要再写宽松的 "2.0.0"（^2.0 会漂移到任意 2.x，导致与 npm 侧错位）。
tauri = { version = "2.12.0", features = ["tray-icon", "image-png"] }
# shell：调用系统命令（如打开外部链接/ 文件管理器），见 src/lib.rs 中的 shell 相关命令。
# 版本下限明确（^2.3.6，即 Cargo.lock 中已验证的版本），避免写成宽松的 "2.0.0" 后被 cargo 静默漂移到未经验证的版本。
tauri-plugin-shell = "2.3.6"
# dialog：导出 OPML / 数据库备份时弹系统「另存为」对话框，让用户自选保存路径。
# 仅在 Rust 侧调用（见 lib.rs::pick_save_path），因此无需在 capabilities 里授权——
# 不授权反而更安全：WebView 无法自行弹出文件对话框。
# 版本下限明确（^2.7.3，即 Cargo.lock 中已验证的版本），避免写成宽松的 "2.0.0" 后被 cargo 静默漂移到未经验证的版本。
tauri-plugin-dialog = "2.7.3"
# notification：应用在后台时发送系统通知（刷新到新文章 / 自动化任务结束，见 src/notify.rs）。
# 同样只在 Rust 侧调用，故 capabilities 不授权。
# **版本保持精确锁在 2.4.0，不要动**：本项目的 tauri 现已锁定在 2.12.x（见上方 tauri 依赖），
# 而 2.4.0 要求 tauri ^2.10，与2.12.x 相容，且已通过 cargo check --lib 与 cargo test --lib 全量验证。
# 若"解绑"写成 "2.4"（等价 ^2.4），cargo 会取最高的 2.5.x 并把 Tauri 框架再往上拉，
# 那是一次未经验证的全量重编；因此这里刻意用 "=" 精确钉死。
tauri-plugin-notification = "=2.4.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite", "chrono", "macros"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }
chrono = { version = "0.4", features = ["serde"] }
url = "2.5"
rss = "2.0"
tokio-cron-scheduler = "0.10"
uuid = "1"
dirs = "5.0"
quick-xml = "0.31"
ammonia = "4"
