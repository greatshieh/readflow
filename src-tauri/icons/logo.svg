<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    ReadFlow 应用图标（OS 级）
    与 src/components/AppLogo.vue 的品牌标志同源：同一套琥珀渐变 + 同一个白色流动箭头标记。
    差异仅在容器形状——OS 图标按平台惯例用圆角方形（squircle）铺满画布，
    应用内标志用圆形徽章。标记与配色保持一致，保证任务栏与界面内的品牌识别连贯。
  -->
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <!-- 底板：圆角方形，rx=112 约为 512 的 22%，与主流桌面图标比例一致 -->
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="url(#brandGrad)"/>

  <!-- 流动箭头标记：R 形弧线 + 收笔的 chevron。
       线宽 40（512 画布上约 7.8%）是为小尺寸留的余量：
       缩到 16px 任务栏时仍有约 1.25px 的可见宽度，不会糊成一团色块。 -->
  <path d="M256 128 C176 128 128 184 128 256 C128 328 176 384 256 384"
        stroke="#ffffff" stroke-width="40" stroke-linecap="round" fill="none"/>
  <path d="M304 208 L256 256 L304 304"
        stroke="#ffffff" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
